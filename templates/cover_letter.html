{% extends "base.html" %}

{% block title %}AI Cover Letter{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2>🤖 AI Cover Letter Generator</h2>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Company Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="company"
                        placeholder="Example: Microsoft"
                        value="{{ company if company else '' }}">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Job Position
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="position"
                        placeholder="Example: Python Developer"
                        value="{{ position if position else '' }}">

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    🤖 Generate Cover Letter

                </button>

            </form>

            {% if cover_letter %}

            <hr>

            <h4 class="mb-3">

                Generated Cover Letter

            </h4>

            <textarea
                class="form-control"
                rows="18"
                readonly>{{ cover_letter }}</textarea>

            <div class="mt-3 d-flex gap-2">

                <a href="{{ url_for('resume.download_cover_letter', id=resume.id) }}"
                   class="btn btn-success">

                    ⬇ Download Cover Letter (.docx)

                </a>

                <a href="{{ url_for('resume.download_cover_letter_pdf', id=resume.id) }}"
class="btn btn-danger">

⬇ Download Cover Letter (.pdf)

</a>

            </div>

            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
