{% extends "base.html" %}

{% block content %}
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label>Username</label>

                        <input
type="text"
class="form-control"
name="username"
required>

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input
type="email"
class="form-control"
name="email"
required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
type="password"
class="form-control"
name="password"
required>

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Register

                    </button>

                <form method="POST">

            </div>

        </div>

    </div>

</div>

{% endblock %}
